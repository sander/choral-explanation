query questions($spaceID: UUID!) {
  spaces(IDs: [$spaceID]) {
    collaboration {
      calloutsSet {
        callouts {
          nameID
          createdDate
          updatedDate
          classification {
            tagsets {
              tags
            }
          }
          createdBy {
            profile {
              ...fullUserProfile
            }
          }
          framing {
            profile {
              url
              displayName
              description
              tagsets {
                tags
              }
            }
          }
          contributions {
            post {
              nameID
              createdDate
              updatedDate
              createdBy {
                profile {
                  ...fullUserProfile
                }
              }
              profile {
                url
                displayName
                description
              }
            }
          }
        }
      }
    }
  }
}

fragment fullUserProfile on Profile {
  id
  location {
    city
    country
  }
  references {
    name
    description
    uri
  }
  tagline
  createdDate
  updatedDate
  url
  displayName
  description
  visual(type: AVATAR) {
    uri
  }
}
